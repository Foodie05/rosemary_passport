name: dependabot-title

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  normalize:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Normalize generated pull request title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|security|refactor|test|docs|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,72}$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            exit 0
          fi

          case "$PR_TITLE" in
            *'/packages/rosm_passport_flutter'*) normalized='chore(deps): update Flutter dependencies' ;;
            *'/apps/passport_server'*) normalized='chore(deps): update server dependencies' ;;
            *'/web'*) normalized='chore(deps): update web dependencies' ;;
            *'github-actions'*|*' action'*) normalized='chore(deps): update GitHub Actions' ;;
            *) normalized='chore(deps): update automated dependencies' ;;
          esac

          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            -f "title=${normalized}" >/dev/null
          printf 'Normalized Dependabot PR title to: %s\n' "$normalized"
