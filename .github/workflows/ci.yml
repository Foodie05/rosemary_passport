name: security-and-quality

on:
  pull_request:
  push:
    branches: [master, main, codex/sla-hardening]

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate repository hygiene
        run: ./scripts/check_repo_hygiene.sh
      - name: Validate commit messages
        env:
          BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.sha }}
        run: ./scripts/check_commit_messages.sh "$BASE_REVISION" "$HEAD_REVISION"
      - name: Verify backup restore integrity controls
        run: |
          ./ops/tests/restore_integrity_test.sh
          ./ops/tests/pitr_drill_safety_test.sh
          ./ops/tests/sla_observation_test.sh
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|security|refactor|test|docs|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,72}$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must follow Conventional Commits: $PR_TITLE" >&2
            exit 1
          fi

  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rosm_passport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rosm_passport_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/passport_server/package-lock.json
      - name: Initialize PostgreSQL snapshot
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d rosm_passport_test -v ON_ERROR_STOP=1 -f ops/postgres/init/001_init.sql
      - name: Install Dart dependencies
        working-directory: apps/passport_server
        run: dart pub get
      - name: Audit helper dependencies
        working-directory: apps/passport_server
        run: npm ci && npm audit --audit-level=high
      - name: Validate helper programs
        working-directory: apps/passport_server
        run: |
          node --check scripts/helper-server.mjs
          node --check scripts/helper-health.mjs
      - name: Format gate
        working-directory: apps/passport_server
        run: dart format --output=none --set-exit-if-changed lib bin routes test tool
      - name: Build production route bundle
        working-directory: apps/passport_server
        run: dart run dart_frog_cli:dart_frog build
      - name: Static analysis
        working-directory: apps/passport_server
        run: dart analyze --fatal-infos
      - name: Generated source gate
        working-directory: apps/passport_server
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/src/models
      - name: Unit and PostgreSQL integration tests
        working-directory: apps/passport_server
        env:
          RUN_POSTGRES_TESTS: "true"
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_NAME: rosm_passport_test
        run: >-
          dart --branch-coverage run test
          --concurrency=1
          --reporter=expanded
          --coverage-path=coverage/lcov.info
          --branch-coverage
      - name: Coverage gate
        working-directory: apps/passport_server
        run: dart run tool/check_coverage.dart coverage/lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: server-coverage
          path: apps/passport_server/coverage/lcov.info

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm audit --audit-level=high
      - working-directory: web
        run: npm run build

  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - working-directory: packages/rosm_passport_flutter
        run: flutter pub get
      - working-directory: packages/rosm_passport_flutter
        run: dart format --output=none --set-exit-if-changed lib test
      - working-directory: packages/rosm_passport_flutter
        run: flutter analyze
      - name: Generated source gate
        working-directory: packages/rosm_passport_flutter
        run: |
          dart run build_runner build
          git diff --exit-code -- lib
      - working-directory: packages/rosm_passport_flutter
        run: flutter test

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build release and containers
        run: |
          dart pub global activate dart_frog_cli
          export PATH="$PATH:$HOME/.pub-cache/bin"
          ./scripts/build_linux_x64.sh
          cd .local/release/auth_cruty_cn_release
          POSTGRES_IMAGE=postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825 \
          NODE_IMAGE=node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0 \
            docker compose --env-file runtime.env.example build
          docker run --rm --entrypoint /usr/local/bin/gosu \
            rosm-passport-postgres:current postgres:postgres id | grep -q 'uid=999(postgres)'
          docker run --rm --entrypoint /usr/local/bin/gosu \
            rosm-passport-helper:current node:node id | grep -q 'uid=1000(node)'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rosm-passport-postgres:current
          # The inherited Go binary is replaced by a reviewed POSIX setpriv
          # wrapper at this path; Trivy otherwise reports stale base-layer
          # Go metadata even though the final filesystem contains no Go binary.
          skip-files: usr/local/bin/gosu
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rosm-passport-helper:current
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: auth_cruty_cn_release-passport_server:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
