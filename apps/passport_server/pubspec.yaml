name: rosm_passport_server
description: ROSM Passport - Secure SSO server powered by Dart Frog.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  dart_frog: ^1.1.0
  dart_frog_auth: ^1.1.0
  dotenv: ^4.2.0
  postgres: ^3.5.12
  pool: ^1.5.2
  jose: ^0.3.5+2
  uuid: ^4.6.0
  crypto: ^3.0.3
  cryptography: ^2.7.0
  collection: ^1.18.0
  dart_jsonwebtoken: ^2.14.1
  argon2: ^1.0.1
  http: ^1.2.1
  mailer: ^6.4.1
  meta: ^1.12.0
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.16.0
  dart_frog_cli: ^1.2.14
  json_serializable: ^6.14.1
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0
  test: ^1.25.0
