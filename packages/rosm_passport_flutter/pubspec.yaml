name: rosm_passport_flutter
description: Flutter SDK for native Rosemary Epass sign-in with OIDC and PKCE.
version: 0.11.0
publish_to: none

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.8'

dependencies:
  rosemary_ui:
    path: vendor/rosemary_ui
  crypto: ^3.0.3
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  http: ^1.2.1
  json_annotation: ^4.12.0
  webview_flutter: ^4.13.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  json_serializable: ^6.8.0
  lints: ^6.1.0

flutter:
  assets:
    - assets/rosemary.png
